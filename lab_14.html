
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>

   
<style>
    body {
        font-family: Arial, sans-serif;
        background: #E6FFFA;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .quiz-container {
        background: #FFFFFF;
        width: 400px;
        max-width: 90%;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px #B2DFDB;
    }

    h1 {
        text-align: center;
        color: #0F766E;
    }

    #progress {
        color: #64748B;
        margin-bottom: 10px;
    }

    #question {
        font-size: 20px;
        margin-bottom: 20px;
        color: #1E293B;
    }

    .option {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #CBD5E1;
        border-radius: 6px;
        background: #F8FAFC;
        color: #1E293B;
        cursor: pointer;
        text-align: left;
        font-size: 16px;
    }

    .option:hover {
        background: #CCFBF1;
        border-color: #0D9488;
    }

    .option:disabled {
        cursor: default;
        color: #1E293B;
    }

    #nextBtn, #restartBtn {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 6px;
        background: #0F766E;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #nextBtn:hover, #restartBtn:hover {
        background: #115E59;
    }

    #nextBtn:disabled {
        background: #94A3B8;
        cursor: not-allowed;
    }

    #result {
        text-align: center;
        color: #1E293B;
    }

    .correct {
        background: #A7F3D0;
        border-color: #059669;
    }

    .wrong {
        background: #FECACA;
        border-color: #DC2626;
    }

    .hidden {
        display: none;
    }
</style>

</head>

<body>

<div class="quiz-container">
    <h1>Quiz Application</h1>

    <div id="quiz">
        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="options"></div>

        <button id="nextBtn" disabled onclick="nextQuestion()">
            Next Question
        </button>
    </div>

    <div id="result" class="hidden">
        <h2>Quiz Completed!</h2>
        <h3 id="score"></h3>
        <p id="message"></p>
        <button id="restartBtn" onclick="restartQuiz()">
            Restart Quiz
        </button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "1. Which language is used to structure web pages?",
            options: ["CSS", "HTML", "Java", "Python"],
            answer: 1
        },
        {
            question: "2. Which language is used to style web pages?",
            options: ["HTML", "Java", "CSS", "C"],
            answer: 2
        },
        {
            question: "3. Which language makes web pages interactive?",
            options: ["JavaScript", "SQL", "HTML", "C"],
            answer: 0
        },
        {
            question: "4. Which tag is used to create a hyperlink?",
            options: ["<p>", "<h1>", "<a>", "<img>"],
            answer: 2
        },
        {
            question: "5. Which keyword declares a block-scoped variable in JavaScript?",
            options: ["print", "let", "echo", "define"],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selected = false;

    function loadQuestion() {
        selected = false;

        document.getElementById("progress").textContent =
            "Question " + (currentQuestion + 1) +
            " of " + questions.length;

        document.getElementById("question").textContent =
            questions[currentQuestion].question;

        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        document.getElementById("nextBtn").disabled = true;

        questions[currentQuestion].options.forEach((option, index) => {
            const button = document.createElement("button");

            button.textContent = option;
            button.className = "option";

            button.onclick = () => checkAnswer(index, button);

            optionsDiv.appendChild(button);
        });

        document.getElementById("nextBtn").textContent =
            currentQuestion === questions.length - 1
                ? "Show Result"
                : "Next Question";
    }

    function checkAnswer(index, button) {
        if (selected) return;

        selected = true;

        const correctAnswer = questions[currentQuestion].answer;
        const buttons = document.querySelectorAll(".option");

        if (index === correctAnswer) {
            score++;
        }

        buttons.forEach((btn, i) => {
            btn.disabled = true;

            if (i === correctAnswer) {
                btn.classList.add("correct");
            } else if (i === index) {
                btn.classList.add("wrong");
            }
        });

        document.getElementById("nextBtn").disabled = false;
    }

    function nextQuestion() {
        if (!selected) return;

        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");

        document.getElementById("score").textContent =
            "Your Score: " + score + " / " + questions.length;

        const percentage = (score / questions.length) * 100;

        document.getElementById("message").textContent =
            percentage >= 80 ? "Excellent work!" :
            percentage >= 50 ? "Good job! Keep practicing." :
            "Keep learning and try again!";
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;

        document.getElementById("quiz").classList.remove("hidden");
        document.getElementById("result").classList.add("hidden");

        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
